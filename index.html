<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Workout Tracker</title>
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#0f1115">
<link rel="stylesheet" href="styles.css">
</head>
<body class="locked">
<div class="login-overlay" id="login-overlay">
  <div class="login-card">
    <h2>Workout Tracker</h2>
    <div class="login-sub">Sign in to continue. <span style="display:block;margin-top:4px;font-size:12px">Trainees: just enter your username — no password.</span></div>
    <form id="login-form">
      <div class="field"><label>Username</label><input id="login-user" autocomplete="username" autocapitalize="none" autocorrect="off" required></div>
      <div class="field"><label>Password <span style="color:var(--muted);font-weight:400">(blank for trainees)</span></label><input id="login-pass" type="password" autocomplete="current-password"></div>
      <div class="login-err" id="login-err"></div>
      <button type="submit">Sign in</button>
    </form>
  </div>
</div>
<header>
  <div class="title"><span class="dot"></span> Workout Tracker</div>
  <div class="sub">
    <span class="sync" id="sync"><span class="sdot"></span><span id="sync-txt">Loading…</span></span>
    <span id="updated"></span>
  </div>
  <div class="profile-bar" id="profile-bar" style="display:none"></div>
</header>

<div class="tab-bar">
  <button class="tab active" data-view="workouts">🏋️ Workouts</button>
  <button class="tab" data-view="nutrition">🍽️ Nutrition</button>
  <button class="tab" data-view="body">⚖️ Body</button>
  <button class="tab" data-view="nureli">🔥 Nureli</button>
</div>

<div class="page">
  <div class="view active" id="view-workouts"></div>
  <div class="view" id="view-nutrition"></div>
  <div class="view" id="view-body"></div>
  <div class="view" id="view-nureli"></div>
</div>

<div class="settings-bar">
  <button class="gear" id="gear">⚙ Settings</button>
</div>

<!-- workout modal -->
<div class="overlay" id="w-overlay">
  <div class="modal" id="w-modal"></div>
</div>
<!-- settings modal -->
<div class="overlay" id="s-overlay">
  <div class="modal" id="s-modal"></div>
</div>

<script src="app.js"></script>
</body>
</html>
